name: Build Debug APK

on:
  push:
    branches: [ "claude/jolly-ramanujan-ktlqss" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Copy APK to dist
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/FocusTimer-debug.apk

      - name: Commit APK to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/FocusTimer-debug.apk
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Update built debug APK [skip ci]"
          git push

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusTimer-debug-apk
          path: dist/FocusTimer-debug.apk
